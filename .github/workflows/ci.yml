name: CI Pipeline - Análisis de Calidad de Código

on:
  push:
    branches: [ main, master, initial-setup ]
  pull_request:
    branches: [ main, master, initial-setup ]
  workflow_dispatch:

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
      
    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Verificar versión de Java
      run: |
        java -version
        mvn -version
        
    - name: Construcción del Proyecto
      run: mvn clean install -DskipTests
      
    - name: Ejecutar Pruebas Unitarias
      run: mvn test
      
    - name: Generar Reporte de Cobertura (JaCoCo)
      run: mvn jacoco:report
      
    - name: Análisis de Estilo (Checkstyle)
      run: mvn checkstyle:checkstyle
      continue-on-error: true
      
    - name: Análisis Estático (PMD)
      run: mvn pmd:pmd pmd:cpd
      continue-on-error: true
      
    - name: Empaquetar Reportes
      if: always()
      run: |
        mkdir -p reports
        # Copiar reporte JaCoCo
        if [ -d "target/site/jacoco" ]; then
          cp -r target/site/jacoco reports/jacoco
        fi
        # Copiar reporte Checkstyle
        if [ -f "target/checkstyle-result.xml" ]; then
          cp target/checkstyle-result.xml reports/
        fi
        # Copiar reporte PMD
        if [ -f "target/pmd.xml" ]; then
          cp target/pmd.xml reports/
        fi
        if [ -f "target/cpd.xml" ]; then
          cp target/cpd.xml reports/
        fi
        # Crear resumen
        echo "# Resumen de Métricas de Calidad" > reports/SUMMARY.md
        echo "" >> reports/SUMMARY.md
        echo "## Fecha de Ejecución: $(date)" >> reports/SUMMARY.md
        echo "" >> reports/SUMMARY.md
        
    - name: Subir Reportes como Artefactos
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: quality-reports
        path: reports/
        retention-days: 30
        
    - name: Publicar Resultados de Tests
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: JUnit Test Results
        path: target/surefire-reports/*.xml
        reporter: java-junit
        fail-on-error: false
        
    - name: Comentario de Resumen
      if: always()
      run: |
        echo "## Resumen del Pipeline CI"
        echo ""
        echo "### Construcción"
        echo "El proyecto fue construido exitosamente"
        echo ""
        echo "### Pruebas"
        if [ -d "target/surefire-reports" ]; then
          TEST_COUNT=$(find target/surefire-reports -name "TEST-*.xml" | wc -l)
          echo "Archivos de reporte encontrados: $TEST_COUNT"
        fi
        echo ""
        echo "### Reportes Generados"
        echo "- JaCoCo (Cobertura de Código)"
        echo "- Checkstyle (Estilo de Código)"
        echo "- PMD (Análisis Estático)"
        echo ""
        echo "Los reportes están disponibles en los artefactos de esta ejecución"
